<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>StudyVault — Tasks & Focus Prototype</title>
<style>
  :root {
    --ink: #17211d;
    --muted: #68736d;
    --paper: #f5f3ec;
    --panel: #fffdf8;
    --line: #d8d8cf;
    --soft: #e9e9df;
    --accent: #116b57;
    --accent-dark: #0b4c3e;
    --accent-soft: #dcece5;
    --gold: #a76922;
    --gold-soft: #f4e6cf;
    --danger: #a33d36;
    --danger-soft: #f5dfdc;
    --shadow: 0 18px 60px rgba(35, 43, 39, .12);
    --radius: 14px;
    --display: Georgia, 'Times New Roman', serif;
    --ui: 'Segoe UI Variable', 'Segoe UI', Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #dedfd9;
    color: var(--ink);
    font-family: var(--ui);
  }
  button, input, textarea, select { font: inherit; }
  button { color: inherit; }
  button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
    outline: 3px solid rgba(17,107,87,.28);
    outline-offset: 2px;
  }
  .prototype-bar {
    height: 54px;
    padding: 0 22px;
    background: #202824;
    color: #f6f5ef;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .prototype-brand { display:flex; align-items:center; gap:10px; font-weight:650; letter-spacing:.01em; }
  .prototype-brand .mark { width:22px; height:22px; border:1px solid #8ca59a; border-radius:6px; display:grid; place-items:center; color:#b5d4c7; font-family:var(--display); }
  .app-switcher { display:flex; padding:3px; border:1px solid #46504b; border-radius:9px; background:#171d1a; }
  .app-switcher button { border:0; background:transparent; color:#aeb8b3; padding:7px 14px; border-radius:6px; cursor:pointer; font-size:13px; }
  .app-switcher button.active { background:#f5f3ec; color:#17211d; }
  .viewport { min-height: calc(100vh - 54px); padding: 28px; display:grid; place-items:center; }
  .app-window {
    width: min(1180px, 100%);
    height: min(760px, calc(100vh - 110px));
    min-height: 620px;
    background: var(--paper);
    border: 1px solid rgba(23,33,29,.17);
    border-radius: 18px;
    box-shadow: var(--shadow);
    overflow: hidden;
    display: grid;
    grid-template-columns: 230px 1fr;
  }
  .sidebar { background:#ecebe3; border-right:1px solid var(--line); padding:28px 18px 20px; display:flex; flex-direction:column; }
  .brand-lockup { padding:0 10px 28px; }
  .brand-eyebrow { font-size:11px; font-weight:750; letter-spacing:.16em; text-transform:uppercase; color:var(--accent); }
  .brand-title { font-family:var(--display); font-size:25px; margin-top:3px; }
  .nav-label { color:var(--muted); font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.12em; padding:0 11px 8px; }
  .nav { display:grid; gap:4px; }
  .nav-btn { width:100%; border:0; background:transparent; padding:11px 12px; border-radius:9px; display:flex; align-items:center; gap:11px; cursor:pointer; text-align:left; font-weight:590; color:#48514d; }
  .nav-btn:hover { background:rgba(255,255,255,.55); }
  .nav-btn.active { color:var(--accent-dark); background:var(--panel); box-shadow:0 1px 0 rgba(0,0,0,.03); }
  .nav-btn svg { width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:1.8; }
  .nav-count { margin-left:auto; min-width:24px; height:21px; padding:0 7px; border-radius:99px; display:grid; place-items:center; background:#dfe1d9; color:#5d6762; font-size:11px; font-weight:700; }
  .nav-btn.active .nav-count { background:var(--accent-soft); color:var(--accent-dark); }
  .sidebar-bottom { margin-top:auto; display:grid; gap:12px; }
  .sync-card { border:1px solid #d3d4cc; background:rgba(255,255,255,.45); border-radius:10px; padding:12px; }
  .sync-row { display:flex; align-items:center; gap:7px; font-size:12px; font-weight:650; }
  .sync-dot { width:8px; height:8px; border-radius:50%; background:#28846c; box-shadow:0 0 0 3px rgba(40,132,108,.12); }
  .sync-detail { margin:7px 0 0; color:var(--muted); font-size:11px; line-height:1.4; }
  .main { min-width:0; background:var(--paper); overflow:auto; }
  .main-inner { padding:38px 42px 44px; max-width:950px; margin:0 auto; }
  .top-row { display:flex; align-items:flex-start; justify-content:space-between; gap:24px; margin-bottom:28px; }
  .eyebrow { font-size:12px; color:var(--accent); text-transform:uppercase; letter-spacing:.14em; font-weight:750; margin-bottom:7px; }
  h1 { font-family:var(--display); font-size:36px; font-weight:500; line-height:1.08; margin:0; letter-spacing:-.02em; }
  .subtitle { color:var(--muted); margin:9px 0 0; font-size:14px; }
  .primary, .secondary, .danger-btn, .ghost { min-height:40px; border-radius:8px; padding:0 15px; font-weight:680; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px; }
  .primary { color:white; background:var(--accent); border:1px solid var(--accent); box-shadow:0 2px 0 var(--accent-dark); }
  .primary:hover { background:#0e5e4d; }
  .secondary { background:var(--panel); border:1px solid #c7cac3; }
  .secondary:hover, .ghost:hover { background:#eeeee7; }
  .ghost { background:transparent; border:1px solid transparent; }
  .danger-btn { color:var(--danger); background:var(--danger-soft); border:1px solid #e4b9b4; }
  .btn-icon { font-size:20px; line-height:1; margin-top:-2px; }
  .toolbar { display:flex; justify-content:space-between; align-items:center; gap:14px; margin-bottom:17px; }
  .filter-pills { display:flex; gap:7px; flex-wrap:wrap; }
  .pill { border:1px solid #d4d6ce; background:transparent; border-radius:99px; padding:7px 11px; color:#5f6863; font-size:12px; font-weight:650; cursor:pointer; }
  .pill.active { color:var(--accent-dark); background:var(--accent-soft); border-color:#bcd8cc; }
  .search { position:relative; width:230px; }
  .search input { width:100%; height:38px; border:1px solid #d2d4cd; border-radius:8px; background:var(--panel); padding:0 12px 0 35px; color:var(--ink); }
  .search svg { position:absolute; left:11px; top:10px; width:17px; height:17px; stroke:#78817c; fill:none; }
  .section-label { margin:24px 0 10px; font-size:11px; text-transform:uppercase; letter-spacing:.13em; color:var(--muted); font-weight:750; display:flex; gap:9px; align-items:center; }
  .section-label::after { content:''; height:1px; flex:1; background:#dcddd6; }
  .task-list { display:grid; gap:9px; }
  .task-card { display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:14px; align-items:center; padding:15px 16px; border:1px solid #d8dad2; background:var(--panel); border-radius:11px; transition:.16s ease; }
  .task-card:hover { border-color:#b7beb9; transform:translateY(-1px); box-shadow:0 7px 22px rgba(33,43,38,.06); }
  .check { width:23px; height:23px; border:1.5px solid #909a95; border-radius:50%; background:transparent; cursor:pointer; display:grid; place-items:center; padding:0; }
  .check:hover { border-color:var(--accent); background:var(--accent-soft); }
  .check.checked { border-color:var(--accent); background:var(--accent); color:white; }
  .task-main { min-width:0; cursor:pointer; }
  .task-title { font-size:15px; font-weight:680; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .task-meta { margin-top:5px; display:flex; flex-wrap:wrap; align-items:center; gap:8px; color:var(--muted); font-size:12px; }
  .tag { padding:3px 7px; border-radius:5px; background:#e8e8df; color:#4e5953; font-size:11px; font-weight:680; }
  .tag.math { background:#e3e9ef; color:#3c556d; }
  .tag.design { background:#eee2d8; color:#75533b; }
  .tag.research { background:#e5e2ed; color:#594d72; }
  .due.overdue { color:var(--danger); font-weight:680; }
  .due.today { color:var(--gold); font-weight:680; }
  .task-actions { display:flex; gap:3px; opacity:.72; }
  .icon-btn { width:34px; height:34px; border:0; border-radius:7px; background:transparent; cursor:pointer; display:grid; place-items:center; color:#59635e; }
  .icon-btn:hover { background:#ecece5; color:var(--ink); }
  .icon-btn svg { width:17px; height:17px; stroke:currentColor; fill:none; stroke-width:1.8; }
  .empty { padding:64px 20px; text-align:center; border:1px dashed #cfd2ca; border-radius:12px; color:var(--muted); }
  .empty strong { color:var(--ink); display:block; font-family:var(--display); font-size:22px; font-weight:500; margin-bottom:6px; }

  /* Focus */
  .focus-main { min-width:0; display:grid; grid-template-rows:auto 1fr; background:var(--paper); }
  .focus-header { height:72px; display:flex; align-items:center; justify-content:space-between; padding:0 34px; border-bottom:1px solid var(--line); }
  .focus-header .brand-title { font-size:22px; }
  .focus-status { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:12px; }
  .focus-layout { min-height:0; display:grid; grid-template-columns:minmax(440px,1.25fr) minmax(310px,.75fr); }
  .timer-stage { padding:34px 48px 38px; display:flex; flex-direction:column; align-items:center; justify-content:center; border-right:1px solid var(--line); position:relative; }
  .mode-switch { display:flex; padding:4px; background:#e7e7de; border-radius:10px; margin-bottom:28px; }
  .mode-switch button { border:0; background:transparent; padding:9px 26px; border-radius:7px; cursor:pointer; color:#68716d; font-weight:700; }
  .mode-switch button.active { background:var(--panel); color:var(--ink); box-shadow:0 1px 5px rgba(0,0,0,.07); }
  .session-kicker { min-height:19px; color:var(--accent); font-size:12px; font-weight:750; letter-spacing:.12em; text-transform:uppercase; margin-bottom:12px; }
  .timer-ring { --progress: 72%; width:250px; height:250px; border-radius:50%; display:grid; place-items:center; background:conic-gradient(var(--accent) var(--progress), #dfe1d9 0); position:relative; }
  .timer-ring::before { content:''; position:absolute; inset:10px; border-radius:50%; background:var(--paper); }
  .timer-copy { position:relative; text-align:center; }
  .timer-time { font-size:62px; font-weight:330; letter-spacing:-.055em; font-variant-numeric:tabular-nums; line-height:1; }
  .timer-state { margin-top:11px; color:var(--muted); font-size:13px; font-weight:620; }
  .timer-controls { display:flex; gap:10px; justify-content:center; margin-top:29px; }
  .timer-controls .primary, .timer-controls .secondary, .timer-controls .danger-btn { min-width:112px; }
  .complete-now { margin-top:10px; border:0; background:transparent; color:var(--accent); text-decoration:underline; text-underline-offset:3px; cursor:pointer; font-size:12px; font-weight:650; }
  .session-panel { padding:38px 35px; background:#efeee7; overflow:auto; }
  .panel-heading { font-family:var(--display); font-size:24px; font-weight:500; margin:0 0 5px; }
  .panel-sub { margin:0 0 27px; color:var(--muted); font-size:13px; line-height:1.45; }
  .field { display:grid; gap:7px; margin-bottom:19px; }
  .field label { font-size:12px; font-weight:720; color:#49534e; }
  .field input, .field textarea, .field select { width:100%; border:1px solid #cfd2ca; background:var(--panel); border-radius:8px; padding:10px 11px; color:var(--ink); }
  .field input, .field select { height:43px; }
  .field textarea { min-height:88px; resize:vertical; }
  .or { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:10px; color:#929994; font-size:10px; text-transform:uppercase; letter-spacing:.1em; margin:-5px 0 15px; }
  .or::before,.or::after { content:''; height:1px; background:#d6d8d1; }
  .duration-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .helper { color:var(--muted); font-size:11px; line-height:1.4; }
  .session-summary { background:var(--panel); border:1px solid #d1d4cc; border-radius:10px; padding:15px; display:grid; gap:10px; }
  .summary-row { display:flex; justify-content:space-between; gap:16px; font-size:12px; color:var(--muted); }
  .summary-row strong { color:var(--ink); text-align:right; }
  .history-wrap, .settings-wrap { padding:38px 42px 44px; overflow:auto; }
  .history-table { width:100%; border-collapse:separate; border-spacing:0 8px; }
  .history-table th { text-align:left; color:var(--muted); font-size:10px; letter-spacing:.11em; text-transform:uppercase; padding:0 12px 4px; }
  .history-table td { background:var(--panel); border-top:1px solid #d8dad2; border-bottom:1px solid #d8dad2; padding:13px 12px; font-size:13px; }
  .history-table td:first-child { border-left:1px solid #d8dad2; border-radius:9px 0 0 9px; }
  .history-table td:last-child { border-right:1px solid #d8dad2; border-radius:0 9px 9px 0; }
  .outcome { display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:730; }
  .outcome::before { content:''; width:7px; height:7px; border-radius:50%; background:var(--accent); }
  .outcome.cancelled { color:var(--danger); }
  .outcome.cancelled::before { background:var(--danger); }
  .settings-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .settings-card { background:var(--panel); border:1px solid #d7d9d2; border-radius:11px; padding:20px; }
  .settings-card h3 { margin:0 0 7px; font-family:var(--display); font-size:20px; font-weight:500; }
  .settings-card p { color:var(--muted); font-size:12px; line-height:1.5; margin:0 0 16px; }
  .path { background:#eeeee7; padding:10px; border-radius:7px; font:11px Consolas, monospace; word-break:break-all; margin-bottom:13px; }

  /* Dialogs */
  .overlay { position:fixed; inset:0; z-index:20; background:rgba(18,25,22,.5); display:grid; place-items:center; padding:24px; }
  .dialog { width:min(520px, 100%); max-height:90vh; overflow:auto; background:var(--paper); border:1px solid rgba(0,0,0,.18); border-radius:15px; box-shadow:0 28px 90px rgba(0,0,0,.25); padding:27px; }
  .dialog.small { width:min(410px,100%); text-align:center; }
  .dialog-head { display:flex; justify-content:space-between; align-items:flex-start; gap:20px; margin-bottom:24px; }
  .dialog h2 { font-family:var(--display); font-size:27px; font-weight:500; margin:0; }
  .dialog p { color:var(--muted); font-size:13px; line-height:1.5; }
  .dialog-actions { display:flex; justify-content:flex-end; gap:9px; margin-top:24px; }
  .dialog.small .dialog-actions { justify-content:center; }
  .close-x { border:0; background:transparent; font-size:25px; color:#68716d; cursor:pointer; line-height:1; }
  .hidden { display:none !important; }
  .toast { position:fixed; z-index:40; left:50%; bottom:26px; transform:translateX(-50%); background:#202824; color:white; padding:11px 15px; border-radius:8px; font-size:12px; box-shadow:0 8px 30px rgba(0,0,0,.22); }
  .slop-note { display:none; }

  @media (max-width: 880px) {
    .viewport { padding:0; display:block; }
    .app-window { width:100%; min-height:calc(100vh - 54px); height:auto; border-radius:0; grid-template-columns:72px 1fr; }
    .brand-title, .brand-eyebrow, .nav-label, .nav-btn span:not(.nav-count), .sync-card { display:none; }
    .sidebar { padding:22px 10px; }
    .nav-btn { justify-content:center; }
    .nav-count { display:none; }
    .main-inner { padding:30px 24px; }
    .focus-layout { grid-template-columns:1fr; }
    .timer-stage { border-right:0; border-bottom:1px solid var(--line); }
    .session-panel { padding:30px 24px; }
    .settings-grid { grid-template-columns:1fr; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
</style>
</head>
<body>
<header class="prototype-bar">
  <div class="prototype-brand"><span class="mark">S</span><span>StudyVault design prototype</span></div>
  <div class="app-switcher" aria-label="Switch prototype app">
    <button id="switchTasks" class="active">Tasks app</button>
    <button id="switchFocus">Focus app</button>
  </div>
</header>
<main class="viewport">
  <section class="app-window" id="tasksApp">
    <aside class="sidebar">
      <div class="brand-lockup"><div class="brand-eyebrow">StudyVault</div><div class="brand-title">Tasks</div></div>
      <div class="nav-label">Workspace</div>
      <nav class="nav">
        <button class="nav-btn active" data-task-view="tasks"><svg viewBox="0 0 24 24"><path d="M5 6h14M5 12h14M5 18h9"/></svg><span>Tasks</span><b class="nav-count" id="activeCount">4</b></button>
        <button class="nav-btn" data-task-view="today"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg><span>Today</span><b class="nav-count" id="todayCount">2</b></button>
        <button class="nav-btn" data-task-view="completed"><svg viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg><span>Completed</span><b class="nav-count" id="completedCount">2</b></button>
        <button class="nav-btn" data-task-view="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21h-4v-.09A1.7 1.7 0 0 0 8.55 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H3v-4h.09A1.7 1.7 0 0 0 4.6 8.55a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.1V3h4v.09A1.7 1.7 0 0 0 15.45 4.6a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.4 9c.1.38.32.73.6 1 .3.27.68.41 1.1.4h.09v4h-.09c-.42-.01-.8.13-1.1.4-.28.27-.5.62-.6 1Z"/></svg><span>Settings</span></button>
      </nav>
      <div class="sidebar-bottom"><div class="sync-card"><div class="sync-row"><span class="sync-dot"></span>Vault connected</div><p class="sync-detail">Events are ready to append to your StudyVault Logs.</p></div></div>
    </aside>
    <div class="main"><div id="taskContent"></div></div>
  </section>

  <section class="app-window hidden" id="focusApp">
    <aside class="sidebar">
      <div class="brand-lockup"><div class="brand-eyebrow">StudyVault</div><div class="brand-title">Focus</div></div>
      <div class="nav-label">Workspace</div>
      <nav class="nav">
        <button class="nav-btn active" data-focus-view="timer"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg><span>Timer</span></button>
        <button class="nav-btn" data-focus-view="history"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg><span>History</span><b class="nav-count" id="historyCount">4</b></button>
        <button class="nav-btn" data-focus-view="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21h-4v-.09A1.7 1.7 0 0 0 8.55 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H3v-4h.09A1.7 1.7 0 0 0 4.6 8.55a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.1V3h4v.09A1.7 1.7 0 0 0 15.45 4.6a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.4 9c.1.38.32.73.6 1 .3.27.68.41 1.1.4h.09v4h-.09c-.42-.01-.8.13-1.1.4-.28.27-.5.62-.6 1Z"/></svg><span>Settings</span></button>
      </nav>
      <div class="sidebar-bottom"><div class="sync-card"><div class="sync-row"><span class="sync-dot"></span>Shared tasks live</div><p class="sync-detail">Active tasks refresh from the local database.</p></div></div>
    </aside>
    <div class="focus-main" id="focusContent"></div>
  </section>
</main>
<div id="modalRoot"></div><div id="toastRoot"></div>
<script>
const icons = {
  edit:'<svg viewBox="0 0 24 24"><path d="m4 20 4.5-1 10-10a2.1 2.1 0 0 0-3-3l-10 10L4 20Z"/><path d="m14 7 3 3"/></svg>',
  trash:'<svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"/></svg>',
  search:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>'
};
let tasks = [
 {id:1,title:'Submit interaction design report',desc:'Export the final report as PDF and include repository links.',category:'Design',due:'Today, 6:00 PM',dueType:'today',completed:false},
 {id:2,title:'Review calculus practice set',desc:'Work through questions 8–15 before the tutorial.',category:'Mathematics',due:'Today, 8:30 PM',dueType:'today',completed:false},
 {id:3,title:'Annotate research sources',desc:'Add short notes and useful quotations to the Obsidian research note.',category:'Research',due:'Yesterday, 4:00 PM',dueType:'overdue',completed:false},
 {id:4,title:'Prepare database schema notes',desc:'Document tables, IDs, and log event states.',category:'Development',due:'Mon, Sep 28',dueType:'',completed:false},
 {id:5,title:'Draft project problem statement',desc:'First draft completed.',category:'Design',due:'Sep 23',dueType:'',completed:true},
 {id:6,title:'Create GitHub repositories',desc:'Created separate Tasks and Focus repositories.',category:'Development',due:'Sep 24',dueType:'',completed:true}
];
let taskView='tasks', taskFilter='All';
let focusView='timer', mode='focus', timerState='idle', totalSeconds=25*60, remaining=25*60, timerId=null;
let sessionTaskId=null, sessionActivity='Independent study';
let sessions=[
 {date:'Sep 25 · 10:14 AM',type:'Focus',activity:'Submit interaction design report',planned:'25 min',actual:'24m 38s',outcome:'Completed'},
 {date:'Sep 25 · 9:31 AM',type:'Break',activity:'—',planned:'5 min',actual:'5m 00s',outcome:'Completed'},
 {date:'Sep 24 · 7:42 PM',type:'Focus',activity:'Review calculus practice set',planned:'25 min',actual:'12m 09s',outcome:'Cancelled'},
 {date:'Sep 24 · 4:08 PM',type:'Focus',activity:'Create GitHub repositories',planned:'40 min',actual:'38m 51s',outcome:'Completed'}
];
function toast(msg){const r=document.getElementById('toastRoot');r.innerHTML='<div class="toast">'+msg+'</div>';setTimeout(()=>r.innerHTML='',2300)}
function categoryClass(c){return c==='Mathematics'?'math':c==='Design'?'design':c==='Research'?'research':''}
function updateCounts(){
 document.getElementById('activeCount').textContent=tasks.filter(t=>!t.completed).length;
 document.getElementById('todayCount').textContent=tasks.filter(t=>!t.completed&&(t.dueType==='today'||t.dueType==='overdue')).length;
 document.getElementById('completedCount').textContent=tasks.filter(t=>t.completed).length;
}
function renderTasks(){
 updateCounts(); document.querySelectorAll('[data-task-view]').forEach(b=>b.classList.toggle('active',b.dataset.taskView===taskView));
 const root=document.getElementById('taskContent');
 if(taskView==='settings'){root.innerHTML=settingsHTML('tasks');bindTaskPage();return;}
 const completed=taskView==='completed';
 let filtered=tasks.filter(t=>t.completed===completed);
 if(taskView==='today') filtered=filtered.filter(t=>t.dueType==='today'||t.dueType==='overdue');
 if(taskFilter!=='All') filtered=filtered.filter(t=>t.category===taskFilter);
 const title=taskView==='today'?'Today':taskView==='completed'?'Completed':'Tasks';
 const sub=taskView==='today'?'Due today and unfinished overdue work.':taskView==='completed'?'Finished work stays available to review or reopen.':'Your active schoolwork, organized in one place.';
 const categories=['All','Design','Development','Mathematics','Research'];
 let sections='';
 if(filtered.length){
   if(taskView==='today'){
     const overdue=filtered.filter(t=>t.dueType==='overdue'), dueToday=filtered.filter(t=>t.dueType==='today');
     if(overdue.length) sections+=taskSection('Overdue',overdue);
     if(dueToday.length) sections+=taskSection('Due today',dueToday);
   } else sections+=taskSection(completed?'Completed tasks':'Active tasks',filtered);
 } else sections='<div class="empty"><strong>Nothing here</strong>Try another category or create a new task.</div>';
 root.innerHTML=`<div class="main-inner"><div class="top-row"><div><div class="eyebrow">${taskView==='today'?'Friday · September 25':'StudyVault Tasks'}</div><h1>${title}</h1><p class="subtitle">${sub}</p></div>${completed?'':'<button class="primary" id="newTask"><span class="btn-icon">＋</span> New task</button>'}</div>
 <div class="toolbar"><div class="filter-pills">${categories.map(c=>`<button class="pill ${taskFilter===c?'active':''}" data-filter="${c}">${c}</button>`).join('')}</div><div class="search">${icons.search}<input aria-label="Search tasks" placeholder="Search tasks" /></div></div>${sections}</div>`;
 bindTaskPage();
}
function taskSection(label,list){return `<div class="section-label">${label}</div><div class="task-list">${list.map(taskCard).join('')}</div>`}
function taskCard(t){return `<article class="task-card"><button class="check ${t.completed?'checked':''}" data-complete="${t.id}" aria-label="${t.completed?'Reopen':'Complete'} ${t.title}">${t.completed?'✓':''}</button><div class="task-main" data-open="${t.id}"><div class="task-title">${t.title}</div><div class="task-meta"><span class="tag ${categoryClass(t.category)}">${t.category}</span><span class="due ${t.dueType}">${t.dueType==='overdue'?'⚠ ':t.dueType==='today'?'◷ ':''}${t.due}</span></div></div><div class="task-actions"><button class="icon-btn" data-edit="${t.id}" aria-label="Edit task">${icons.edit}</button><button class="icon-btn" data-delete="${t.id}" aria-label="Delete task">${icons.trash}</button></div></article>`}
function bindTaskPage(){
 document.getElementById('newTask')?.addEventListener('click',()=>taskDialog());
 document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{taskFilter=b.dataset.filter;renderTasks()});
 document.querySelectorAll('[data-complete]').forEach(b=>b.onclick=()=>{const t=tasks.find(x=>x.id==b.dataset.complete);t.completed=!t.completed;toast(t.completed?'Task completed and logged':'Task reopened and logged');renderTasks();renderFocus()});
 document.querySelectorAll('[data-open],[data-edit]').forEach(b=>b.onclick=()=>taskDialog(tasks.find(x=>x.id==(b.dataset.open||b.dataset.edit))));
 document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>confirmDelete(+b.dataset.delete));
 document.getElementById('changeVault')?.addEventListener('click',()=>toast('Folder picker would open in the Electron app'));
 document.getElementById('retryAll')?.addEventListener('click',()=>toast('No failed events to retry'));
}
function taskDialog(task){
 const isEdit=!!task; document.getElementById('modalRoot').innerHTML=`<div class="overlay"><form class="dialog" id="taskForm"><div class="dialog-head"><div><div class="eyebrow">${isEdit?'Task details':'New assignment'}</div><h2>${isEdit?'Edit task':'Create a task'}</h2></div><button class="close-x" type="button" data-close>×</button></div><div class="field"><label for="title">Title</label><input id="title" required value="${task?.title||''}" placeholder="What needs to be done?" /></div><div class="field"><label for="desc">Description <span style="font-weight:400;color:var(--muted)">(optional)</span></label><textarea id="desc" placeholder="Add useful details">${task?.desc||''}</textarea></div><div class="duration-row"><div class="field"><label for="date">Due date</label><input id="date" type="date" value="2026-09-28" /></div><div class="field"><label for="time">Due time</label><input id="time" type="time" value="18:00" /></div></div><div class="field"><label for="category">Category</label><select id="category">${['Uncategorized','Design','Development','Mathematics','Research'].map(c=>`<option ${task?.category===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="dialog-actions">${isEdit?'<button class="danger-btn" type="button" id="dialogDelete">Delete</button>':''}<button class="secondary" type="button" data-close>Cancel</button><button class="primary" type="submit">${isEdit?'Save changes':'Create task'}</button></div></form></div>`;
 document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>document.getElementById('modalRoot').innerHTML='');
 document.getElementById('dialogDelete')?.addEventListener('click',()=>confirmDelete(task.id));
 document.getElementById('taskForm').onsubmit=e=>{e.preventDefault(); const data={title:document.getElementById('title').value,desc:document.getElementById('desc').value,category:document.getElementById('category').value,due:'Mon, Sep 28 · 6:00 PM',dueType:'',completed:task?.completed||false}; if(isEdit) Object.assign(task,data); else tasks.unshift({id:Date.now(),...data}); document.getElementById('modalRoot').innerHTML='';toast(isEdit?'Task updated and event logged':'Task created and event logged');renderTasks();renderFocus()};
}
function confirmDelete(id){const t=tasks.find(x=>x.id===id);document.getElementById('modalRoot').innerHTML=`<div class="overlay"><div class="dialog small"><div class="eyebrow">Confirm deletion</div><h2>Delete this task?</h2><p>“${t.title}” will be removed from normal views. A deletion event remains in the StudyVault ledger.</p><div class="dialog-actions"><button class="secondary" data-close>Keep task</button><button class="danger-btn" id="confirmDelete">Delete task</button></div></div></div>`;document.querySelector('[data-close]').onclick=()=>document.getElementById('modalRoot').innerHTML='';document.getElementById('confirmDelete').onclick=()=>{tasks=tasks.filter(x=>x.id!==id);document.getElementById('modalRoot').innerHTML='';toast('Task deleted and event logged');renderTasks();renderFocus()}}
function settingsHTML(app){return `<div class="settings-wrap"><div class="top-row"><div><div class="eyebrow">${app==='tasks'?'StudyVault Tasks':'StudyVault Focus'}</div><h1>Settings</h1><p class="subtitle">Shared local storage and Obsidian logging.</p></div></div><div class="settings-grid"><section class="settings-card"><h3>Obsidian vault</h3><p>Both apps write append-only Markdown records to this selected vault.</p><div class="path">C:\\Users\\Student\\Documents\\Study Vault</div><button class="secondary" id="changeVault">Change vault</button></section><section class="settings-card"><h3>Event delivery</h3><p>Actions are saved locally before the Markdown append is attempted.</p><div class="session-summary"><div class="summary-row"><span>Failed events</span><strong>0</strong></div><div class="summary-row"><span>Last successful write</span><strong>Just now</strong></div></div><button class="secondary" id="retryAll" style="margin-top:13px">Retry all</button></section></div></div>`}
function renderFocus(){
 document.getElementById('historyCount').textContent=sessions.length;
 document.querySelectorAll('[data-focus-view]').forEach(b=>b.classList.toggle('active',b.dataset.focusView===focusView));
 const root=document.getElementById('focusContent');
 if(focusView==='history'){root.innerHTML=historyHTML();return}
 if(focusView==='settings'){root.innerHTML=settingsHTML('focus');bindFocusSettings();return}
 const activeTasks=tasks.filter(t=>!t.completed);
 const running=timerState==='running', paused=timerState==='paused', finished=timerState==='finished';
 const pct=Math.max(0,(remaining/totalSeconds)*100);
 root.innerHTML=`<header class="focus-header"><div><div class="brand-eyebrow">StudyVault</div><div class="brand-title">Focus timer</div></div><div class="focus-status"><span class="sync-dot"></span> Vault connected</div></header><div class="focus-layout"><section class="timer-stage"><div class="mode-switch"><button data-mode="focus" class="${mode==='focus'?'active':''}" ${running||paused?'disabled':''}>Focus</button><button data-mode="break" class="${mode==='break'?'active':''}" ${running||paused?'disabled':''}>Break</button></div><div class="session-kicker">${finished?'Time’s up':running?mode==='focus'?'Focusing':'Taking a break':paused?'Paused':'Ready when you are'}</div><div class="timer-ring" style="--progress:${pct}%"><div class="timer-copy"><div class="timer-time">${formatTime(remaining)}</div><div class="timer-state">${finished?'Complete when you are ready':running?'Active time':paused?'Active time is paused':mode==='focus'?'25 minute focus':'5 minute break'}</div></div></div><div class="timer-controls">${timerControls()}</div>${(running||paused)&&mode==='focus'?'<button class="complete-now" id="completeNow">Complete session now</button>':''}</section><aside class="session-panel">${sessionPanel(activeTasks,running||paused||finished)}</aside></div>`;
 bindFocus();
}
function sessionPanel(activeTasks,locked){
 if(locked){return `<h2 class="panel-heading">Current session</h2><p class="panel-sub">The task snapshot is retained even if the original task changes later.</p><div class="session-summary"><div class="summary-row"><span>Type</span><strong>${mode==='focus'?'Focus':'Break'}</strong></div>${mode==='focus'?`<div class="summary-row"><span>Task / activity</span><strong>${sessionActivity}</strong></div>`:''}<div class="summary-row"><span>Planned duration</span><strong>${Math.round(totalSeconds/60)} minutes</strong></div><div class="summary-row"><span>Actual active time</span><strong>${formatElapsed(totalSeconds-remaining)}</strong></div></div>`}
 return `<h2 class="panel-heading">Plan this session</h2><p class="panel-sub">Choose a shared task or describe what you want to work on.</p>${mode==='focus'?`<div class="field"><label for="taskSelect">Active task</label><select id="taskSelect"><option value="">Select a task…</option>${activeTasks.map(t=>`<option value="${t.id}">${t.title}</option>`).join('')}</select></div><div class="or">or</div><div class="field"><label for="activity">Activity description</label><textarea id="activity" placeholder="e.g. Read chapter 4 and take notes"></textarea></div>`:'<div class="session-summary"><div class="summary-row"><span>Session type</span><strong>Break</strong></div><div class="summary-row"><span>Task required</span><strong>No</strong></div></div>'}<div class="field" style="margin-top:19px"><label for="duration">Duration</label><select id="duration"><option value="1">1 minute · prototype</option><option value="5" ${mode==='break'?'selected':''}>5 minutes</option><option value="25" ${mode==='focus'?'selected':''}>25 minutes</option><option value="40">40 minutes</option><option value="50">50 minutes</option></select><span class="helper">You can change the duration before starting.</span></div>`}
function timerControls(){if(timerState==='idle')return '<button class="primary" id="startTimer">Start '+(mode==='focus'?'focus':'break')+'</button>';if(timerState==='running')return '<button class="secondary" id="pauseTimer">Pause</button><button class="danger-btn" id="stopTimer">Stop</button>';if(timerState==='paused')return '<button class="primary" id="resumeTimer">Resume</button><button class="danger-btn" id="stopTimer">Stop</button>';return '<button class="primary" id="finishTimer">Complete session</button>'}
function bindFocus(){
 document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;totalSeconds=remaining=(mode==='focus'?25:5)*60;renderFocus()});
 document.getElementById('startTimer')?.addEventListener('click',()=>{const d=+document.getElementById('duration').value;const taskSelect=document.getElementById('taskSelect');sessionTaskId=taskSelect?.value?+taskSelect.value:null;sessionActivity=sessionTaskId?tasks.find(t=>t.id===sessionTaskId)?.title:(document.getElementById('activity')?.value.trim()||'Independent study');totalSeconds=remaining=d*60;timerState='running';startTick();toast('Session started and event logged');renderFocus()});
 document.getElementById('pauseTimer')?.addEventListener('click',()=>{timerState='paused';clearInterval(timerId);renderFocus()});
 document.getElementById('resumeTimer')?.addEventListener('click',()=>{timerState='running';startTick();renderFocus()});
 document.getElementById('stopTimer')?.addEventListener('click',()=>finishSession('Cancelled'));
 document.getElementById('completeNow')?.addEventListener('click',()=>finishSession('Completed'));
 document.getElementById('finishTimer')?.addEventListener('click',()=>finishSession('Completed'));
}
function startTick(){clearInterval(timerId);timerId=setInterval(()=>{if(timerState==='running'){remaining=Math.max(0,remaining-1);if(remaining===0){clearInterval(timerId);timerState='finished';toast('Timer finished — waiting for completion');}renderFocus()}},1000)}
function finishSession(outcome){clearInterval(timerId);const actual=totalSeconds-remaining;sessions.unshift({date:'Sep 25 · now',type:mode==='focus'?'Focus':'Break',activity:mode==='focus'?sessionActivity:'—',planned:Math.round(totalSeconds/60)+' min',actual:formatElapsed(actual),outcome});timerState='idle';remaining=totalSeconds=(mode==='focus'?25:5)*60;if(outcome==='Completed'&&mode==='focus')taskFinishedDialog();else{toast('Session cancelled and event logged');renderFocus()}}
function taskFinishedDialog(){const t=tasks.find(t=>t.id===sessionTaskId&&!t.completed);document.getElementById('modalRoot').innerHTML=`<div class="overlay"><div class="dialog small"><div class="eyebrow">Focus complete</div><h2>Is this task finished?</h2><p>${t?`You focused on “${t.title}”. You can mark it complete in the shared task list.`:'Your completed session has been saved.'}</p><div class="dialog-actions"><button class="secondary" id="notYet">No, not yet</button>${t?'<button class="primary" id="markDone">Yes, mark done</button>':''}</div></div></div>`;document.getElementById('notYet').onclick=()=>{document.getElementById('modalRoot').innerHTML='';toast('Session completed; task remains active');renderFocus()};document.getElementById('markDone')?.addEventListener('click',()=>{t.completed=true;document.getElementById('modalRoot').innerHTML='';toast('Session and task completion logged');renderFocus();renderTasks()})}
function historyHTML(){return `<div class="history-wrap"><div class="top-row"><div><div class="eyebrow">Study record</div><h1>Focus history</h1><p class="subtitle">Completed and cancelled sessions retained locally.</p></div></div><table class="history-table"><thead><tr><th>Date & time</th><th>Type</th><th>Task or activity</th><th>Planned</th><th>Actual</th><th>Outcome</th></tr></thead><tbody>${sessions.map(s=>`<tr><td>${s.date}</td><td>${s.type}</td><td>${s.activity}</td><td>${s.planned}</td><td>${s.actual}</td><td><span class="outcome ${s.outcome==='Cancelled'?'cancelled':''}">${s.outcome}</span></td></tr>`).join('')}</tbody></table></div>`}
function bindFocusSettings(){document.getElementById('changeVault')?.addEventListener('click',()=>toast('Folder picker would open in the Electron app'));document.getElementById('retryAll')?.addEventListener('click',()=>toast('No failed events to retry'))}
function formatTime(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function formatElapsed(s){return Math.floor(s/60)+'m '+String(s%60).padStart(2,'0')+'s'}
document.getElementById('switchTasks').onclick=()=>{document.getElementById('tasksApp').classList.remove('hidden');document.getElementById('focusApp').classList.add('hidden');document.getElementById('switchTasks').classList.add('active');document.getElementById('switchFocus').classList.remove('active')};
document.getElementById('switchFocus').onclick=()=>{document.getElementById('focusApp').classList.remove('hidden');document.getElementById('tasksApp').classList.add('hidden');document.getElementById('switchFocus').classList.add('active');document.getElementById('switchTasks').classList.remove('active');renderFocus()};
document.querySelectorAll('[data-task-view]').forEach(b=>b.onclick=()=>{taskView=b.dataset.taskView;renderTasks()});
document.querySelectorAll('[data-focus-view]').forEach(b=>b.onclick=()=>{focusView=b.dataset.focusView;renderFocus()});
renderTasks();renderFocus();
</script>
</body>
</html>
